<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoBs — mixture of behaviors</title>
<style>
  :root {
    --ink:#1a1a18; --dim:#7d7a73; --line:#e2e0da; --bg:#faf9f6; --panel:#ffffff;
    --live:#5b7f00; --off:#c9c6bf; --route:#3a6fb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink:#e8e6e1; --dim:#7d7a73; --line:#2a2a28; --bg:#131312; --panel:#1a1a18;
      --live:#c8e64a; --off:#3a3a36; --route:#4a7fc8;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
         font:14px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
         padding:26px 18px 60px; display:flex; justify-content:center; }
  main { width:100%; max-width:880px; }
  h1 { font-size:13px; letter-spacing:.22em; text-transform:uppercase;
       font-weight:500; margin:0 0 2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:24px; }

  .desk { border:1px solid var(--line); background:var(--panel);
          padding:18px 16px 6px; }
  .strip { display:grid; grid-template-columns:96px 1fr 46px 34px 30px;
           gap:12px; align-items:center; padding:8px 0;
           border-bottom:1px solid var(--line); }
  .strip:last-child { border-bottom:none; }
  .strip.muted .nm, .strip.muted .val { color:var(--off); }
  .nm { font-size:12px; letter-spacing:.05em; }
  .val { text-align:right; font-size:12px; color:var(--dim);
         font-variant-numeric:tabular-nums; }
  .rt { font-size:10px; color:var(--route); text-align:right;
        font-variant-numeric:tabular-nums; opacity:0; transition:opacity .3s; }
  .rt.on { opacity:1; }

  input[type=range] { -webkit-appearance:none; appearance:none; width:100%;
    height:2px; background:var(--line); outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none;
    width:12px; height:20px; background:var(--live); cursor:grab; border-radius:1px; }
  input[type=range]::-moz-range-thumb { width:12px; height:20px;
    background:var(--live); cursor:grab; border:none; border-radius:1px; }
  .strip.muted input[type=range]::-webkit-slider-thumb { background:var(--off); }
  .strip.muted input[type=range]::-moz-range-thumb { background:var(--off); }

  .mute { width:30px; height:21px; border:1px solid var(--line); background:none;
          color:var(--dim); font:inherit; font-size:10px; cursor:pointer; }
  .mute[aria-pressed=true] { border-color:var(--live); color:var(--live); }

  .row { display:flex; gap:8px; align-items:center; padding:11px 0 0;
         flex-wrap:wrap; }
  .row button { border:1px solid var(--line); background:none; color:var(--dim);
    font:inherit; font-size:11px; padding:5px 11px; cursor:pointer; }
  .row button:hover { color:var(--ink); border-color:var(--dim); }
  .row label { font-size:11px; color:var(--dim); display:flex; gap:5px;
               align-items:center; cursor:pointer; }

  textarea { width:100%; min-height:72px; background:var(--panel); color:var(--ink);
    border:1px solid var(--line); padding:10px 11px; font:inherit; resize:vertical;
    margin-top:14px; }
  textarea:focus { outline:none; border-color:var(--dim); }

  .go { margin-top:10px; display:flex; gap:9px; align-items:center; }
  .go button.primary { background:var(--live); color:#141410; border:none;
    font:inherit; font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    padding:9px 20px; cursor:pointer; }
  .go button.primary:disabled { background:var(--off); color:var(--dim); cursor:default; }
  .go button.ghost { background:none; color:var(--dim); border:1px solid var(--line);
    font:inherit; font-size:12px; padding:9px 16px; cursor:pointer; }
  .stat { color:var(--dim); font-size:11px; }

  pre { white-space:pre-wrap; word-wrap:break-word; border:1px solid var(--line);
    background:var(--panel); padding:14px; margin:16px 0 0; min-height:110px;
    font:inherit; }
  pre:empty::before { content:"Output appears here."; color:var(--off); }
  .caret::after { content:"▌"; color:var(--live); }
  footer { color:var(--off); font-size:11px; margin-top:20px; }
</style>
</head>
<body>
<main>
  <h1>Mixture of behaviors</h1>
  <p class="sub">One frozen base. Behaviors blend per token; the router decides how
     much each contributes. Pull every fader to zero and the model is untouched.</p>

  <div class="desk" id="desk"><span class="stat">Connecting…</span></div>

  <div class="row">
    <button id="allOn">All 1.0</button>
    <button id="allOff">All 0</button>
    <label><input type="checkbox" id="pin"> pin (ignore router)</label>
    <label><input type="checkbox" id="showRoute" checked> show routing</label>
  </div>

  <textarea id="prompt">Write a Python function that reverses a string.</textarea>

  <div class="go">
    <button class="primary" id="run" disabled>Generate</button>
    <button class="ghost" id="stop" hidden>Stop</button>
    <span class="stat" id="stat"></span>
  </div>

  <pre id="out"></pre>
  <footer id="foot"></footer>
</main>

<script type="module">
const $ = id => document.getElementById(id);
let meta = null, gammas = {}, ctrl = null;

async function boot() {
  const r = await fetch("/api/meta");
  if (!r.ok) throw new Error(`meta: HTTP ${r.status}`);
  meta = await r.json();

  $("desk").innerHTML = "";
  for (const name of meta.behaviors) {
    gammas[name] = 1.0;
    const row = document.createElement("div");
    row.className = "strip";
    row.innerHTML =
      `<span class="nm">${name}</span>
       <input type="range" min="0" max="150" step="5" value="100">
       <span class="val">1.00</span>
       <span class="rt" data-rt="${name}"></span>
       <button class="mute" aria-pressed="false" title="Mute ${name}">M</button>`;
    const sl = row.querySelector("input"), val = row.querySelector(".val"),
          mute = row.querySelector(".mute");
    const paint = () => {
      const on = mute.getAttribute("aria-pressed") === "false";
      gammas[name] = on ? sl.value / 100 : 0;
      val.textContent = gammas[name].toFixed(2);
      row.classList.toggle("muted", gammas[name] === 0);
    };
    sl.oninput = paint;
    mute.onclick = () => {
      mute.setAttribute("aria-pressed",
        mute.getAttribute("aria-pressed") === "true" ? "false" : "true");
      paint();
    };
    row.__set = v => { sl.value = Math.round(v * 100);
                       mute.setAttribute("aria-pressed", "false"); paint(); };
    $("desk").appendChild(row);
  }
  $("run").disabled = false;
  $("foot").textContent =
    `${meta.base} · ${meta.quant} · ${meta.device} · `
    + `layers [${meta.layers}] · route ${meta.route_layer}`;
}

const setAll = v => [...$("desk").children].forEach(r => r.__set && r.__set(v));

// Ask the router what it makes of the prompt, without generating.
let routeTimer = null;
async function showRouting() {
  if (!$("showRoute").checked || !meta) {
    document.querySelectorAll(".rt").forEach(e => e.classList.remove("on"));
    return;
  }
  try {
    const r = await fetch("/api/route", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ prompt: $("prompt").value }),
    });
    const w = (await r.json()).weights || {};
    for (const [k, v] of Object.entries(w)) {
      const e = document.querySelector(`[data-rt="${CSS.escape(k)}"]`);
      if (e) { e.textContent = (v * 100).toFixed(0) + "%"; e.classList.add("on"); }
    }
  } catch { /* routing preview is optional */ }
}

async function generate() {
  const out = $("out");
  out.textContent = "";
  out.classList.add("caret");
  $("run").disabled = true;
  $("stop").hidden = false;
  $("stat").textContent = "";
  ctrl = new AbortController();

  try {
    const r = await fetch("/api/generate", {
      method: "POST", headers: { "content-type": "application/json" },
      signal: ctrl.signal,
      body: JSON.stringify({ prompt: $("prompt").value, gammas,
                             pin: $("pin").checked }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${(await r.text()).slice(0, 200)}`);

    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith("data: ")) continue;
        const d = JSON.parse(p.slice(6));
        if (d.error) { out.textContent += `\n\n[server error: ${d.error}]`; }
        else if (d.done) {
          $("stat").textContent = `${d.tokens} tokens · ${d.tok_per_s} tok/s`;
        } else out.textContent += d.t;
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") out.textContent += `\n\n[${e.message}]`;
    else $("stat").textContent += " · stopped";
  } finally {
    out.classList.remove("caret");
    $("stop").hidden = true;
    $("run").disabled = false;
    ctrl = null;
  }
}

$("run").onclick = generate;
$("stop").onclick = () => ctrl && ctrl.abort();
$("allOn").onclick = () => setAll(1);
$("allOff").onclick = () => setAll(0);
$("showRoute").onchange = showRouting;
$("prompt").oninput = () => {
  clearTimeout(routeTimer);
  routeTimer = setTimeout(showRouting, 400);
};

boot().then(showRouting).catch(e => {
  $("desk").innerHTML = `<span class="stat">Could not reach the server: ${e.message}</span>`;
});
</script>
</body>
</html>
