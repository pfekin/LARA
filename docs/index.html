<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LARA — behavior mixer</title>
<style>
  :root {
    --ink:#e8e6e1; --dim:#7d7a73; --line:#2a2a28; --bg:#131312; --panel:#1a1a18;
    --live:#c8e64a; --off:#3a3a36;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink); min-height:100vh;
    font:14px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    padding:28px 20px 60px; display:flex; justify-content:center;
  }
  main { width:100%; max-width:860px; }
  h1 { font-size:13px; letter-spacing:.22em; text-transform:uppercase;
       font-weight:500; margin:0 0 2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:26px; }
  .sub b { color:var(--ink); font-weight:500; }

  .desk { border:1px solid var(--line); background:var(--panel);
          padding:20px 18px 8px; margin-bottom:18px; }
  .strip { display:grid; grid-template-columns:104px 1fr 54px 30px;
           gap:14px; align-items:center; padding:9px 0;
           border-bottom:1px solid var(--line); }
  .strip:last-child { border-bottom:none; }
  .strip.muted .nm, .strip.muted .val { color:var(--off); }
  .nm { font-size:12px; letter-spacing:.06em; }
  .val { text-align:right; font-size:12px; color:var(--dim);
         font-variant-numeric:tabular-nums; }

  input[type=range] { -webkit-appearance:none; appearance:none; width:100%;
    height:2px; background:var(--line); outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none;
    width:13px; height:22px; background:var(--live); cursor:grab; border-radius:1px; }
  input[type=range]::-moz-range-thumb { width:13px; height:22px; background:var(--live);
    cursor:grab; border:none; border-radius:1px; }
  .strip.muted input[type=range]::-webkit-slider-thumb { background:var(--off); }
  .strip.muted input[type=range]::-moz-range-thumb { background:var(--off); }

  .mute { width:30px; height:22px; border:1px solid var(--line); background:none;
          color:var(--dim); font:inherit; font-size:10px; cursor:pointer; }
  .mute[aria-pressed=true] { border-color:var(--live); color:var(--live); }

  .bar { height:2px; background:var(--line); margin:10px 0 2px; display:none; }
  .bar.on { display:block; }
  .bar i { display:block; height:100%; width:0; background:var(--live);
           transition:width .2s linear; }
  .allbar { display:flex; gap:8px; padding:12px 0 4px; }
  .allbar button { flex:0 0 auto; border:1px solid var(--line); background:none;
    color:var(--dim); font:inherit; font-size:11px; padding:5px 11px; cursor:pointer; }
  .allbar button:hover { color:var(--ink); border-color:var(--dim); }

  textarea { width:100%; min-height:74px; background:var(--panel); color:var(--ink);
    border:1px solid var(--line); padding:11px 12px; font:inherit; resize:vertical; }
  textarea:focus { outline:none; border-color:var(--dim); }

  .go { margin-top:10px; display:flex; gap:10px; align-items:center; }
  .go button { background:var(--live); color:#141410; border:none; font:inherit;
    font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    padding:9px 20px; cursor:pointer; }
  .go button:disabled { background:var(--off); color:var(--dim); cursor:default; }
  .go button.ghost { background:none; color:var(--dim); border:1px solid var(--line); }
  .go button.ghost:hover { color:var(--ink); border-color:var(--dim); }
  .stat { color:var(--dim); font-size:11px; }

  pre { white-space:pre-wrap; word-wrap:break-word; border:1px solid var(--line);
    background:var(--panel); padding:15px; margin:18px 0 0; min-height:96px;
    font:inherit; }
  pre:empty::before { content:"Output appears here."; color:var(--off); }
  .caret::after { content:"▌"; color:var(--live); }
  footer { color:var(--off); font-size:11px; margin-top:22px; }
</style>
</head>
<body>
<main>
  <h1>LARA behavior mixer</h1>
  <p class="sub">One frozen <b id="baseName">base model</b>. Behaviors blend per token.
     Pull every fader to zero and the output is the untouched base.</p>

  <div class="desk" id="desk"></div>
  <div class="stat" id="boot">Starting…</div>
  <div class="bar" id="bar"><i></i></div>
  <div class="allbar">
    <button id="allOn">All on</button>
    <button id="allOff">All off</button>
    <button id="clear" title="Delete the cached weights">Clear cache</button>
  </div>

  <textarea id="prompt">Write a Python function that reverses a string.</textarea>
  <div class="go">
    <button id="run" disabled>Generate</button>
    <button id="stop" class="ghost" hidden>Stop</button>
    <span class="stat" id="stat"></span>
  </div>
  <pre id="out"></pre>
  <footer id="foot"></footer>
</main>

<script type="module">
import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.23.0/dist/ort.webgpu.min.mjs";
import { AutoTokenizer, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.0.0";

const $ = id => document.getElementById(id);
const say = t => { const e = $("boot"); if (e) e.textContent = t; };
const bar = f => {
  const b = $("bar");
  if (!b) return;
  b.classList.toggle("on", f >= 0);
  if (f >= 0) b.firstElementChild.style.width = `${Math.round(f * 100)}%`;
};

// Local export, or a Hub repo id ("pfekin/lara-qwen3-1.7b-onnx"). The Hub sends
// permissive CORS headers, so the page itself can be served from anywhere.
const SOURCE = "pfekin/lara-qwen3-1.7b-onnx";
const MAX_NEW = 160;

const ON_HUB = SOURCE.includes("/") && !SOURCE.startsWith(".") && !SOURCE.startsWith("/");
const FILES = ON_HUB ? `https://huggingface.co/${SOURCE}/resolve/main` : SOURCE;

if (ON_HUB) {
  env.allowRemoteModels = true;
  env.allowLocalModels = false;
} else {
  env.allowRemoteModels = false;
  env.allowLocalModels = true;
  env.localModelPath = "./";
}

let sess, tok, meta, coeff, inputNames, hasPast, pastNames = [];
let stopping = false;

function strips() {
  $("desk").innerHTML = "";
  meta.behaviors.forEach((name, i) => {
    const row = document.createElement("div");
    row.className = "strip";
    row.innerHTML =
      `<span class="nm">${name}</span>
       <input type="range" min="0" max="150" value="100" step="5" data-i="${i}">
       <span class="val">1.00</span>
       <button class="mute" aria-pressed="false" title="Mute ${name}">M</button>`;
    const slider = row.querySelector("input"), val = row.querySelector(".val"),
          mute = row.querySelector(".mute");
    const paint = () => {
      const on = mute.getAttribute("aria-pressed") === "false";
      coeff[i] = on ? slider.value / 100 : 0;
      val.textContent = coeff[i].toFixed(2);
      row.classList.toggle("muted", !on || coeff[i] === 0);
    };
    slider.oninput = paint;
    mute.onclick = () => {
      mute.setAttribute("aria-pressed",
        mute.getAttribute("aria-pressed") === "true" ? "false" : "true");
      paint();
    };
    row.__set = v => { slider.value = Math.round(v * 100);
                       mute.setAttribute("aria-pressed", "false"); paint(); };
    $("desk").appendChild(row);
  });
}

const setAll = v => [...$("desk").children].forEach(r => r.__set && r.__set(v));

const CACHE = "lara-weights-v1";
let cachedAny = false;

// Storage for gigabyte weights. OPFS is the right tool: it takes a write stream,
// so chunks go to disk as they arrive and the whole file is never held twice in
// memory -- which is what makes the Cache API fail at this size. Safari lacks
// createWritable outside workers, so the Cache API stays as a fallback.
const store = {
  key: u => "lara_" + u.split("/").pop(),

  async dir() {
    if (!navigator.storage?.getDirectory) return null;
    try { return await navigator.storage.getDirectory(); } catch { return null; }
  },

  async read(url) {
    const k = this.key(url);
    const d = await this.dir();
    if (d) {
      let f = null;
      try {
        f = await (await d.getFileHandle(k)).getFile();
      } catch (e) {
        console.log(`[store] ${k}: not on disk yet (${e.name})`);
      }
      if (f) {
        console.log(`[store] ${k}: found ${(f.size / 1e6).toFixed(0)} MB`);
        if (f.size === 0) {
          console.warn(`[store] ${k}: zero bytes, discarding`);
          try { await d.removeEntry(k); } catch {}
        } else {
          try {
            // Never swallow this. Materialising a multi-GB file can fail with
            // RangeError (ArrayBuffer ceiling) or OOM, and a silent catch here
            // looks exactly like "nothing was cached".
            return await f.arrayBuffer();
          } catch (e) {
            console.error(`[store] ${k}: read back FAILED — ${e.name}: ${e.message}`);
            say(`Stored weights could not be read back (${e.name}). Re-downloading.`);
          }
        }
      }
    } else {
      console.warn("[store] OPFS unavailable");
    }
    try {
      const hit = await (await caches.open(CACHE)).match(url);
      if (hit) { console.log(`[store] ${k}: served from Cache API`); return await hit.arrayBuffer(); }
    } catch (e) { console.log("[store] cache api miss:", e.name); }
    return null;
  },

  // returns a sink that accepts chunks, or null if nothing can store them
  async writer(url) {
    const d = await this.dir();
    if (!d) return null;
    try {
      const fh = await d.getFileHandle(this.key(url), { create: true });
      if (!fh.createWritable) return null;
      const w = await fh.createWritable();
      return {
        write: c => w.write(c),
        close: () => w.close(),
        abort: async () => { try { await w.abort(); } catch {}
                             try { await d.removeEntry(this.key(url)); } catch {} },
      };
    } catch (e) {
      console.warn(`[store] cannot open a writer for ${this.key(url)}:`,
                   e.name, e.message);
      return null;
    }
  },

  async clear() {
    const d = await this.dir();
    if (d) for await (const n of d.keys())
      if (n.startsWith("lara_")) { try { await d.removeEntry(n); } catch {} }
    try { await caches.delete(CACHE); } catch {}
  },
};

async function fetchProgress(url, label, from, to) {
  const cached = await store.read(url);
  if (cached) {
    say(`Reading ${label} from storage…`);
    bar(to);
    cachedAny = true;
    return cached;
  }

  const r = await fetch(url);
  if (!r.ok) {
    throw new Error(r.status === 401 || r.status === 403
      ? `${label}: ${r.status} — make the repo public`
      : `${label}: HTTP ${r.status} for ${url}`);
  }
  const total = +(r.headers.get("content-length") || 0);
  const sink = await store.writer(url);
  const chunks = [];
  let got = 0;
  const reader = r.body.getReader();
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      if (sink) await sink.write(value);          // straight to disk, no second copy
      got += value.length;
      const mb = (got / 1e6).toFixed(0);
      if (total) {
        say(`Fetching ${label}: ${mb} / ${(total / 1e6).toFixed(0)} MB`);
        bar(from + (to - from) * (got / total));
      } else {
        say(`Fetching ${label}: ${mb} MB`);
      }
    }
    if (sink) {
      await sink.close();
      const back = await (await (await store.dir())
        .getFileHandle(store.key(url))).getFile().catch(() => null);
      console.log(`[store] wrote ${label}: ${(got / 1e6).toFixed(0)} MB, `
                + `on disk afterwards: ${back ? (back.size / 1e6).toFixed(0) + " MB" : "MISSING"}`);
    }
  } catch (e) {
    console.error(`[store] download/write of ${label} failed:`, e.name, e.message);
    if (sink) await sink.abort();
    throw e;
  }

  const buf = new Uint8Array(got);
  let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.length; }
  if (!sink) {
    say(`${label} could not be stored — it will download again next visit.`);
    console.warn("no persistent storage available for", label);
  }
  return buf.buffer;
}

async function clearCache() {
  await store.clear();
  say("Stored weights cleared. Reload to fetch them again.");
}

async function probeWebGPU() {
  if (!navigator.gpu) {
    return { ok: false, why: "navigator.gpu is undefined — no WebGPU in this browser" };
  }
  let ad;
  try { ad = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" }); }
  catch (e) { return { ok: false, why: `requestAdapter threw: ${e.name} ${e.message}` }; }
  if (!ad) return { ok: false, why: "requestAdapter returned null — no usable GPU" };

  const L = ad.limits;
  const info = ad.info || {};
  console.log("[gpu] vendor:", info.vendor, "arch:", info.architecture,
              "desc:", info.description);
  console.log("[gpu] maxBufferSize:",
              (L.maxBufferSize / 1e6).toFixed(0), "MB");
  console.log("[gpu] maxStorageBufferBindingSize:",
              (L.maxStorageBufferBindingSize / 1e6).toFixed(0), "MB");
  return { ok: true, adapter: ad, limits: L, info };
}

async function reportQuota() {
  try {
    const { quota = 0, usage = 0 } = await navigator.storage.estimate();
    console.log(`storage: ${(usage / 1e9).toFixed(2)} GB used of `
              + `${(quota / 1e9).toFixed(2)} GB available`);
    return quota - usage;
  } catch { return null; }
}

async function boot() {
  try {
    if (navigator.storage?.persist && !(await navigator.storage.persisted())) {
      console.log("persistent storage granted:", await navigator.storage.persist());
    }
  } catch { /* not supported */ }
  const gpu = await probeWebGPU();
  if (!gpu.ok) console.warn("[gpu]", gpu.why);
  const free = await reportQuota();
  if (free !== null && free < 2.5e9) {
    say(`Only ${(free / 1e9).toFixed(1)} GB of browser storage free — the `
      + `weights may not cache and would download again each visit.`);
  }
  const metaUrl = `${FILES}/lara.json`;
  const mr = await fetch(metaUrl);
  if (!mr.ok) {
    throw new Error(
      mr.status === 401 || mr.status === 403
        ? `${mr.status} on lara.json — the repo is private. A page cannot send a `
          + `token; make ${SOURCE} public.`
        : `HTTP ${mr.status} fetching ${metaUrl}`);
  }
  const raw = await mr.text();
  if (raw.trimStart().startsWith("<")) {
    throw new Error(`lara.json came back as HTML, not JSON. Open ${metaUrl} `
                  + `directly — the repo is probably private or the file is missing.`);
  }
  meta = JSON.parse(raw);
  $("baseName").textContent = meta.base;
  coeff = new Float32Array(meta.behaviors.length).fill(1);
  strips();

  tok = await AutoTokenizer.from_pretrained(SOURCE);

  say("Fetching weights — first visit downloads the whole model.");

  // Weights over 2GB live in a companion file. The browser cannot reach the
  // filesystem, so ORT has to be told about it; `path` must match the location
  // string recorded inside the protobuf. Fetching both ourselves buys a
  // progress bar, which matters when it is gigabytes.
  const dataFile = meta.external_data || "model.onnx.data";
  const graph = await fetchProgress(`${FILES}/model.onnx`, "graph", 0, 0.02);
  const weights = await fetchProgress(`${FILES}/${dataFile}`, "weights", 0.02, 1);
  const opts = { externalData: [{ data: new Uint8Array(weights), path: dataFile }] };

  say("Compiling — this takes a moment.");
  bar(1);

  let ep = "webgpu";
  let gpuErr = null;
  if (!gpu.ok) {
    gpuErr = gpu.why;
  } else {
    try {
      sess = await ort.InferenceSession.create(new Uint8Array(graph),
        { ...opts, executionProviders: ["webgpu"], graphOptimizationLevel: "all" });
    } catch (e) {
      gpuErr = `${e.name}: ${e.message}`;
      console.error("[gpu] session creation failed:", e);
    }
  }

  if (gpuErr) {
    // WASM runs this model at a fraction of a token per second. Falling back
    // silently just looks like the page is broken, so make it a choice.
    ep = "wasm";
    say(`WebGPU unavailable — ${gpuErr}`);
    console.warn("[gpu] falling back to wasm, which will be extremely slow");
    if (!confirm(`WebGPU could not start:\n\n${gpuErr}\n\n`
               + `WASM will work but runs at well under 1 token/second.\n`
               + `Continue anyway?`)) {
      throw new Error(`WebGPU unavailable: ${gpuErr}`);
    }
    sess = await ort.InferenceSession.create(new Uint8Array(graph),
      { ...opts, executionProviders: ["wasm"] });
  }

  inputNames = new Set(sess.inputNames);
  if (!inputNames.has(meta.coeff_input))
    throw new Error(`graph has no '${meta.coeff_input}' input — promotion did not run`);
  hasPast = inputNames.has("past_key_values.0.key");
  for (let i = 0; i < meta.n_layers; i++)
    for (const kv of ["key", "value"]) pastNames.push(`past_key_values.${i}.${kv}`);

  strips();
  bar(-1);
  say("");
  $("run").disabled = false;
  if (gpu.ok) {
    const mb = (gpu.limits.maxBufferSize / 1e6).toFixed(0);
    console.log(`[gpu] session created on webgpu; largest allowed buffer ${mb} MB`);
  }
  $("foot").textContent =
    `${ep} · ${meta.behaviors.length} behaviors · layers [${meta.layers}] · `
    + `route ${meta.route_layer} · weights ${cachedAny ? "from cache" : "downloaded"}`;
}

function emptyKV() {
  const t = {};
  if (!hasPast) return t;
  for (const n of pastNames)
    t[n] = new ort.Tensor("float32", new Float32Array(0),
                          [1, meta.n_kv_heads, 0, meta.head_dim]);
  return t;
}

async function generate() {
  stopping = false;
  $("run").disabled = true;
  $("stop").hidden = false;
  const out = $("out");
  out.textContent = "";
  out.classList.add("caret");

  // Newer transformers saves the chat template to a separate chat_template.jinja
  // rather than embedding it in tokenizer_config.json, so it may not be on the
  // Hub at all. Fall back to writing Qwen3's ChatML by hand — the empty <think>
  // block is what enable_thinking:false produces, and the behaviors were
  // trained against exactly that prefix.
  const user = $("prompt").value;
  let text;
  try {
    text = await tok.apply_chat_template(
      [{ role: "user", content: user }],
      { tokenize: false, add_generation_prompt: true, enable_thinking: false });
  } catch (e) {
    console.warn("no chat template, using literal ChatML:", e.message);
    text = `<|im_start|>user\n${user}<|im_end|>\n`
         + `<|im_start|>assistant\n<think>\n\n</think>\n\n`;
  }
  let ids = Array.from((await tok(text, { add_special_tokens: false })).input_ids.data,
                       Number);

  const promptLen = ids.length;
  let past = emptyKV(), step = ids, total = 0;
  const t0 = performance.now();

  for (let n = 0; n < MAX_NEW; n++) {
    if (stopping) break;
    const feed = {
      input_ids: new ort.Tensor("int64", BigInt64Array.from(step, BigInt), [1, step.length]),
      attention_mask: new ort.Tensor("int64",
        BigInt64Array.from({ length: total + step.length }, () => 1n), [1, total + step.length]),
      // read live: moving a fader mid-generation takes effect on the next token
      [meta.coeff_input]: new ort.Tensor("float32", Float32Array.from(coeff),
                                         [coeff.length]),
      ...past,
    };
    if (inputNames.has("position_ids"))
      feed.position_ids = new ort.Tensor("int64",
        BigInt64Array.from({ length: step.length }, (_, k) => BigInt(total + k)),
        [1, step.length]);

    const res = await sess.run(feed);
    total += step.length;

    const lg = res.logits, V = lg.dims[2];
    const row = lg.data.subarray((lg.dims[1] - 1) * V, lg.dims[1] * V);
    let best = 0;
    for (let v = 1; v < V; v++) if (row[v] > row[best]) best = v;
    if (best === meta.eos_token_id) break;

    ids.push(best);
    out.textContent = tok.decode(ids.slice(promptLen), { skip_special_tokens: true });

    if (hasPast) {
      past = {};
      for (const n2 of pastNames) past[n2] = res[n2.replace("past_key_values", "present")];
      step = [best];
    } else {
      step = ids;                       // no cache: re-read the whole sequence
      total = 0;
    }
    await new Promise(r => setTimeout(r, 0));   // let clicks land between tokens
  }

  out.classList.remove("caret");
  const secs = (performance.now() - t0) / 1000;
  const made = ids.length - promptLen;
  $("stat").textContent = `${made} tokens · ${(made / secs).toFixed(1)} tok/s`
                        + (stopping ? " · stopped" : "");
  $("stop").hidden = true;
  $("run").disabled = false;
}

$("run").onclick = () => generate().catch(e => {
  console.error(e);
  $("out").textContent = "Generation failed: " + e.message;
  $("out").classList.remove("caret");
  $("stop").hidden = true;
  $("run").disabled = false;
});
// The loop yields to the event queue every few tokens, so the click lands
// between forward passes rather than interrupting one.
$("stop").onclick = () => { stopping = true; $("stop").disabled = true;
                            setTimeout(() => { $("stop").disabled = false; }, 600); };
$("allOn").onclick = () => setAll(1);
$("allOff").onclick = () => setAll(0);
$("clear").onclick = () => clearCache();

boot().catch(e => {
  console.error(e);
  bar(-1);
  say("Could not start: " + (e && e.message ? e.message : e));
});
</script>
</body>
</html>
